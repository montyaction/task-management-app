name: task-management-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npx nodemon src/server.js
    restart: unless-stopped
